name: Container release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            file: apps/api/Dockerfile
          - name: dashboard
            context: .
            file: apps/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mail-tracker-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mail-tracker-${{ matrix.name }}:latest
